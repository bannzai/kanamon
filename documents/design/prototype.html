<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カナモン うごく デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap">
<style>
:root{
  --ink:#33241A; --cream:#FFF6E3; --paper:#FFFFFF;
  --red:#D93B2B; --red-dk:#A62A1D; --red-lt:#F4634F;
  --yellow:#FFC22E; --blue:#2BA9FF; --blue-dk:#1F7FC4;
  --green:#4CC66A; --pink:#FF9FC4; --sand:#F0E3C9; --sand-dk:#A8977A;
  --r-s:20px; --r-m:26px; --r-l:30px;
  --bd:5px; --bd-s:4px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#2A1B14;
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:20px 12px 40px; min-height:100vh;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; border:none; background:none; padding:0; margin:0; cursor:pointer; color:inherit;}

/* ------- ずかん デバイス の がいそう ------- */
.device{
  position:relative; flex:none;
  background:linear-gradient(180deg,var(--red-lt) 0%,var(--red) 26%,var(--red-dk) 100%);
  border:6px solid var(--ink); border-radius:38px;
  box-shadow:0 14px 0 #7A1D13, 0 26px 46px rgba(0,0,0,.5);
  padding:74px 18px 20px;
}
.device::after{
  content:""; position:absolute; left:18px; right:18px; top:64px; height:4px;
  background:rgba(0,0,0,.16); border-radius:2px;
}
.dev-top{position:absolute; top:16px; left:20px; right:20px; height:44px; display:flex; align-items:center; gap:10px;}
.lens{
  width:44px; height:44px; border-radius:50%; flex:none;
  border:5px solid var(--ink);
  background:radial-gradient(circle at 32% 28%, #BFE9FF 0%, #4FB8FF 42%, #1668B0 100%);
  box-shadow:inset 0 0 0 4px #EAF6FF;
  position:relative; overflow:hidden;
}
.lens::before{
  content:""; position:absolute; left:8px; top:6px; width:14px; height:9px;
  background:rgba(255,255,255,.92); border-radius:50%; transform:rotate(-24deg);
}
.lamp{width:15px; height:15px; border-radius:50%; border:3px solid var(--ink); flex:none;}
.lamp.r{background:#FF5A3C;} .lamp.y{background:var(--yellow);} .lamp.g{background:var(--green);}
.lamp.on{animation:blink 1.1s steps(1,end) infinite;}
@keyframes blink{0%,60%{filter:brightness(1);}61%,100%{filter:brightness(.55);}}
.dev-title{
  margin-left:auto; font-size:19px; font-weight:900; color:#FFFFFF; letter-spacing:.08em;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink);
}

/* ------- はめこみ の がめん ------- */
.screen{
  position:relative; width:390px; height:844px; overflow:hidden;
  background:var(--cream); border:6px solid var(--ink); border-radius:24px;
  box-shadow:inset 0 0 0 4px #F7D9D2;
}
.view{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden;}
.view[hidden]{display:none;}
.view-in{animation:viewIn .26s ease-out both;}
@keyframes viewIn{from{opacity:0; transform:translateX(16px) scale(.985);}to{opacity:1; transform:none;}}
.view-in.back{animation-name:viewInBack;}
@keyframes viewInBack{from{opacity:0; transform:translateX(-16px) scale(.985);}to{opacity:1; transform:none;}}
.pad{padding:20px; display:flex; flex-direction:column; gap:14px; height:100%;}
.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}

/* ------- きょうつう パーツ ------- */
.card{background:var(--paper); border:var(--bd) solid var(--ink); border-radius:var(--r-m); box-shadow:0 8px 0 var(--ink);}
.card-s{background:var(--paper); border:var(--bd-s) solid var(--ink); border-radius:var(--r-s); box-shadow:0 5px 0 var(--ink);}
.hd{display:flex; align-items:center; gap:12px; flex:none; height:64px;}
.hd h1{margin:0; font-size:30px; font-weight:900; line-height:1; flex:1; min-width:0; white-space:nowrap;}
.iconbtn{
  width:60px; height:60px; flex:none; background:var(--paper);
  border:var(--bd) solid var(--ink); border-radius:var(--r-s); box-shadow:0 5px 0 var(--ink);
  display:flex; align-items:center; justify-content:center; transition:transform .07s, box-shadow .07s;
}
.press:active{transform:translateY(5px); box-shadow:0 0 0 var(--ink);}
.big{
  height:96px; border:var(--bd) solid var(--ink); border-radius:var(--r-l); box-shadow:0 9px 0 var(--ink);
  display:flex; align-items:center; justify-content:center; gap:12px;
  font-size:30px; font-weight:900; color:#FFFFFF; background:var(--red);
  transition:transform .07s, box-shadow .07s;
}
.big:disabled{opacity:.45;}
.pill{
  display:inline-flex; align-items:center; height:40px; padding:0 11px; flex:none; white-space:nowrap;
  background:var(--yellow); border:var(--bd-s) solid var(--ink); border-radius:13px;
  font-size:16px; font-weight:900; box-shadow:0 4px 0 var(--ink);
}
.muted{opacity:.62;}

/* ------- ホーム ------- */
.home-hero{
  display:flex; align-items:center; gap:12px; flex:none;
  background:var(--paper); border:var(--bd) solid var(--ink); border-radius:var(--r-m);
  box-shadow:0 8px 0 var(--ink); padding:12px 16px 14px;
}
.home-hero .t{font-size:40px; font-weight:900; color:var(--red); line-height:1;}
.home-hero .s{font-size:15px; font-weight:800; margin-top:6px; line-height:1.35;}
.menu{display:flex; flex-direction:column; gap:10px; flex:1; min-height:0;}
.mbtn{
  display:flex; align-items:center; gap:12px; flex:1; min-height:86px; padding:0 14px; text-align:left;
  border:var(--bd) solid var(--ink); border-radius:var(--r-l); box-shadow:0 9px 0 var(--ink);
  transition:transform .07s, box-shadow .07s;
}
.mbtn .ico{
  width:62px; height:62px; flex:none; background:var(--paper);
  border:var(--bd-s) solid var(--ink); border-radius:18px;
  display:flex; align-items:center; justify-content:center;
}
.mbtn .tt{display:block; font-size:27px; font-weight:900; line-height:1;}
.mbtn .ss{display:block; font-size:13px; font-weight:800; margin-top:5px; line-height:1.25; opacity:.8;}

/* ------- ずかん ------- */
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; align-content:start; padding-bottom:8px;}
.mon{
  position:relative; height:128px; padding:6px 4px 4px; background:var(--paper);
  border:var(--bd-s) solid var(--ink); border-radius:var(--r-s); box-shadow:0 5px 0 var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px;
  transition:transform .07s, box-shadow .07s;
}
.mon.locked{background:var(--sand); border-color:#C8B698; box-shadow:0 5px 0 #C8B698;}
.mon .no{
  position:absolute; top:4px; left:6px; font-size:11px; font-weight:900; letter-spacing:.02em; opacity:.55;
}
.mon img{width:74px; height:74px; object-fit:contain; display:block;}
.mon.locked img{filter:brightness(0) opacity(.34);}
.mon .nm{font-size:14px; font-weight:900; line-height:1.05; text-align:center;}
.mon.locked .nm{color:var(--sand-dk);}
.bar{height:22px; background:var(--cream); border:var(--bd-s) solid var(--ink); border-radius:13px; overflow:hidden; display:flex;}
.bar>i{display:block; background:var(--green); transition:width .5s cubic-bezier(.2,.8,.3,1);}

/* ------- もじ (よみ / かき きょうつう) ------- */
.moji-row{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
.moji{
  display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 6px 4px;
  border:var(--bd-s) solid var(--ink); border-radius:14px; background:var(--paper);
  box-shadow:0 4px 0 var(--ink); min-width:52px;
  transition:transform .12s, background .12s, box-shadow .12s;
}
.moji .k{font-size:33px; font-weight:900; line-height:1.02;}
.moji .h{font-size:16px; font-weight:800; line-height:1; color:var(--blue-dk);}
.moji.on{background:var(--yellow); transform:translateY(-5px) scale(1.07); box-shadow:0 8px 0 var(--ink);}
.moji.warn{border-color:var(--red); box-shadow:0 4px 0 var(--red);}
.moji.done{background:#E5F7E9;}
#row[style*="nowrap"] .moji{min-width:0; padding:4px 7px;}
#row[style*="nowrap"] .moji .k{font-size:27px;}

/* ------- こたえ の ボタン ------- */
.choices{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.choice{
  min-height:88px; padding:6px; background:var(--paper);
  border:var(--bd) solid var(--ink); border-radius:var(--r-m); box-shadow:0 7px 0 var(--ink);
  font-size:26px; font-weight:900; display:flex; align-items:center; justify-content:center;
  transition:transform .07s, box-shadow .07s, background .18s;
}
.choice.ok{background:var(--green); color:#fff; animation:pop .4s ease;}
.choice.ng{background:#FFD9D2; animation:shake .38s ease;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.09);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

/* ------- ゲット の えんしゅつ ------- */
.get{position:absolute; inset:0; z-index:30; background:rgba(255,194,46,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:28px;}
.get[hidden]{display:none;}
.rays{position:absolute; inset:0; pointer-events:none; animation:spin 14s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.get-mon{
  width:214px; height:214px; border-radius:50%; background:var(--paper); border:6px solid var(--ink);
  box-shadow:0 10px 0 var(--ink); display:flex; align-items:center; justify-content:center;
  animation:bounceIn .62s cubic-bezier(.18,1.5,.5,1) both; z-index:2;
}
.get-mon img{width:172px; height:172px; object-fit:contain;}
@keyframes bounceIn{0%{transform:scale(.2) rotate(-22deg); opacity:0;}60%{transform:scale(1.12) rotate(5deg); opacity:1;}100%{transform:scale(1) rotate(0);}}
.get-ttl{
  font-size:62px; font-weight:900; color:#fff; line-height:1; z-index:2;
  text-shadow:5px 0 0 var(--ink),-5px 0 0 var(--ink),0 5px 0 var(--ink),0 -5px 0 var(--ink),4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -4px 0 var(--ink),-4px -4px 0 var(--ink),0 13px 0 var(--red);
  animation:drop .5s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes drop{from{transform:translateY(-46px) scale(.7); opacity:0;}to{transform:none; opacity:1;}}
.stamp{
  position:absolute; right:12px; top:388px; z-index:6; padding:6px 16px 8px; border:6px solid var(--red);
  color:var(--red); font-size:27px; font-weight:900; border-radius:10px; letter-spacing:.08em;
  transform:rotate(-13deg); background:rgba(255,255,255,.82);
  animation:stampIn .42s cubic-bezier(.2,2.2,.5,1) .5s both;
}
@keyframes stampIn{0%{transform:rotate(-13deg) scale(2.6); opacity:0;}70%{opacity:1;}100%{transform:rotate(-13deg) scale(1); opacity:1;}}
.confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:4;}
.confetti i{position:absolute; width:11px; height:16px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{from{transform:translateY(-40px) rotate(0);}to{transform:translateY(880px) rotate(760deg);}}

/* ------- かきれんしゅう ------- */
.trace-wrap{position:relative; flex:none; background:var(--paper); border:var(--bd) solid var(--ink); border-radius:var(--r-m); box-shadow:0 8px 0 var(--ink); overflow:hidden;}
.trace-wrap svg{display:block; width:100%; height:auto; touch-action:none;}
.guide-grid{stroke:#E4D9C4; stroke-width:1; stroke-dasharray:4 4;}
.stroke-done{stroke:var(--ink); stroke-width:5.5; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.stroke-ghost{stroke:#E0D3BA; stroke-width:5.5; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.stroke-demo{stroke:var(--blue); stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.stroke-live{stroke:var(--green); stroke-width:7; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:.85;}
.startdot{fill:var(--red); animation:pulse 1.05s ease-in-out infinite;}
.snum circle{fill:#FFFFFF; stroke:var(--ink); stroke-width:2.4;}
.snum text{fill:var(--ink); font-size:9px; font-weight:900; text-anchor:middle; dominant-baseline:central; font-family:'M PLUS Rounded 1c',sans-serif;}
.snum.now circle{fill:var(--yellow); animation:numpulse 1.1s ease-in-out infinite;}
@keyframes numpulse{0%,100%{r:7;}50%{r:8.6;}}
.snum.past circle{fill:#E9DFCC; stroke:#BCAC90;}
.snum.past text{fill:#9C8B6E;}
.arrowhead{fill:var(--red); stroke:#FFFFFF; stroke-width:1.2; stroke-linejoin:round;}
@keyframes pulse{0%,100%{r:6; opacity:1;}50%{r:9.5; opacity:.45;}}

/* ------- もじずかん (ごじゅうおんひょう) ------- */
.gojuon{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px;}
.gj{
  aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  background:var(--sand); border:3px solid #C8B698; border-radius:12px; color:var(--sand-dk);
}
.gj .k{font-size:22px; font-weight:900; line-height:1;}
.gj .h{font-size:11px; font-weight:800; line-height:1;}
.gj.got{background:var(--paper); border-color:var(--ink); color:var(--ink); box-shadow:0 3px 0 var(--ink);}
.gj.got .h{color:var(--blue-dk);}
.gj.blank{background:none; border:none; box-shadow:none;}

/* ------- なまえ づくり ------- */
.slots{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
.slot{
  width:56px; height:62px; flex:none; background:#F6F1FF; border:4px dashed #B7A6E0;
  border-radius:15px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:background .16s, border-color .16s, transform .16s;
}
.slot .k{font-size:29px; font-weight:900; line-height:1;}
.slot .h{font-size:13px; font-weight:800; line-height:1; color:var(--blue-dk);}
.slot.filled{background:var(--paper); border:4px solid var(--ink); box-shadow:0 4px 0 var(--ink); animation:pop .26s ease;}
.slot.ok{background:var(--green); border-color:var(--ink);}
.slot.ok .k, .slot.ok .h{color:#fff;}
.pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
.ptile{
  width:60px; height:64px; flex:none; background:var(--paper); border:var(--bd-s) solid var(--ink);
  border-radius:16px; box-shadow:0 5px 0 var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:transform .07s, box-shadow .07s, opacity .16s;
}
.ptile .k{font-size:30px; font-weight:900; line-height:1;}
.ptile .h{font-size:13px; font-weight:800; line-height:1; color:var(--blue-dk);}
.ptile.spent{opacity:.26; box-shadow:none; transform:translateY(5px);}

/* ------- したから でる シート ------- */
.sheet{position:absolute; inset:0; z-index:35; display:flex; flex-direction:column; justify-content:flex-end;}
.sheet-bg{position:absolute; inset:0; background:rgba(51,36,26,.42); animation:fadeIn .2s ease-out both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet-card{
  position:relative; max-height:74%; display:flex; flex-direction:column; gap:10px;
  background:var(--cream); border-top:var(--bd) solid var(--ink); border-left:var(--bd) solid var(--ink);
  border-right:var(--bd) solid var(--ink); border-radius:var(--r-l) var(--r-l) 0 0; padding:14px 14px 18px;
  animation:sheetUp .26s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes sheetUp{from{transform:translateY(60px); opacity:0;}to{transform:none; opacity:1;}}
.sheet-hd{display:flex; align-items:center; gap:12px; flex:none;}
.sheet-moji{
  width:62px; height:62px; flex:none; background:var(--yellow); border:var(--bd-s) solid var(--ink);
  border-radius:16px; box-shadow:0 4px 0 var(--ink); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:0;
}
.sheet-moji .k{font-size:28px; font-weight:900; line-height:1;}
.sheet-moji .h{font-size:12px; font-weight:800; line-height:1; color:var(--blue-dk);}
.sheet-body{overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-bottom:4px;}
.hitrow{
  display:flex; align-items:center; gap:12px; padding:8px 12px; flex:none;
  background:var(--paper); border:var(--bd-s) solid var(--ink); border-radius:18px;
  box-shadow:0 4px 0 var(--ink); transition:transform .07s, box-shadow .07s;
}
.hitrow img{width:52px; height:52px; object-fit:contain; flex:none;}
.hitno{display:block; font-size:12px; font-weight:900; opacity:.55; line-height:1;}
.hitname{display:block; margin-top:4px; font-size:23px; font-weight:900; line-height:1;}
.mini{display:inline-block;}
.mini.hit{color:var(--red); border-bottom:4px solid var(--yellow);}

/* ------- ヒント / トースト ------- */
.note{
  display:flex; align-items:flex-start; gap:8px; padding:10px 12px; flex:none;
  background:#FFF1CF; border:var(--bd-s) solid var(--ink); border-radius:16px;
  font-size:14px; font-weight:800; line-height:1.45; white-space:pre-line;
}
.note[hidden]{display:none;}
.toast{
  position:absolute; left:20px; right:20px; bottom:24px; z-index:40; padding:14px 16px;
  background:var(--ink); color:#fff; border-radius:18px; font-size:16px; font-weight:800; line-height:1.4;
  animation:toastIn .3s ease-out both;
}
.toast[hidden]{display:none;}
@keyframes toastIn{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}
.spinner{width:44px; height:44px; border:6px solid var(--sand); border-top-color:var(--red); border-radius:50%; animation:spin 1s linear infinite;}
.center{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; height:100%; padding:24px; text-align:center; font-size:17px; font-weight:800; line-height:1.5;}

/* ------- デモ の そとがわ ------- */
.demo-note{
  max-width:640px; color:#F0DED4; font-size:13px; line-height:1.7; font-weight:700; text-align:center;
}
.demo-note b{color:#FFC22E;}
.demo-note a{color:#FFC22E;}
</style>
</head>
<body>
<div class="device">
  <div class="dev-top">
    <div class="lens"></div>
    <div class="lamp r on"></div><div class="lamp y"></div><div class="lamp g"></div>
    <div class="dev-title">カナモン</div>
  </div>
  <div class="screen" id="screen"></div>
</div>
<p class="demo-note">
  うごく デモ (プロトタイプ) — ポケモンの日本語名と画像は起動時に <b>PokeAPI</b> から取得しています。
  文字の書き順データは <b>KanjiVG</b> (CC BY-SA 3.0 / Ulrich Apel) を実行時に取得。読み上げは Web Speech API (ja-JP)。<br>
  画面をタップして操作してください。よみれんしゅう・クイズは左右スワイプでも動きます。
</p>
<script>
'use strict';

/* ============================================================
   データ そう: PokeAPI / KanjiVG から じっこうじ に とりよせる
   （ポケモンの がぞう・なまえ は ファイルに かきこまない）
   ============================================================ */

const DEX = [1,4,7,25,39,52,54,63,66,74,92,95,129,133,143,147];   // デモ用の 16 ひき
const API = 'https://pokeapi.co/api/v2';
const KVG = 'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji';

const state = {
  mons: [],            // {id, no, kata, hira, img}
  caught: new Set(),   // ゲット した id
  readChars: new Set(),// よめた カタカナ
  wroteChars: new Set(),// かけた カタカナ
  view: 'home',
  yomiIndex: 0,
  quizIndex: 0,
  quizMode: 0,         // 0: 4たく / 1: あなぬけ / 2: なまえ→え
  kakiIndex: 0,
  tsukuruIndex: 0,
};

const strokeCache = new Map();

/* カタカナ → ひらがな（1 対 1 の コードポイント へんかん）*/
function toHira(s){
  return [...s].map(c=>{
    const n = c.codePointAt(0);
    return (n>=0x30A1 && n<=0x30F6) ? String.fromCodePoint(n-0x60) : c;
  }).join('');
}
/* なまえ を 1 もじずつ に わける（ャュョッ と ゛゜ は まえの もじ と くっつけない: 1 もじ として あつかう）*/
function splitChars(s){ return [...s]; }

async function fetchMon(id){
  const [sp, pk] = await Promise.all([
    fetch(`${API}/pokemon-species/${id}`).then(r=>r.json()),
    fetch(`${API}/pokemon/${id}`).then(r=>r.json()),
  ]);
  const jp = sp.names.find(n=>n.language.name==='ja-hrkt') || sp.names.find(n=>n.language.name==='ja');
  const kata = jp ? jp.name : String(sp.name);
  return {
    id,
    no: String(sp.id).padStart(3,'0'),
    kata,
    hira: toHira(kata),
    img: pk.sprites.other['official-artwork'].front_default,
  };
}

/* KanjiVG から 1 もじ ぶんの ストローク（かきじゅん の じゅんばん つき）を とる */
async function fetchStrokes(ch){
  if (strokeCache.has(ch)) return strokeCache.get(ch);
  const code = ch.codePointAt(0).toString(16).padStart(5,'0');
  const p = fetch(`${KVG}/${code}.svg`).then(async r=>{
    if(!r.ok) throw new Error('no stroke data');
    const doc = new DOMParser().parseFromString(await r.text(), 'image/svg+xml');
    return [...doc.querySelectorAll('path[id]')]
      .filter(el=>/-s\d+$/.test(el.id))
      .sort((a,b)=>(+a.id.match(/-s(\d+)$/)[1]) - (+b.id.match(/-s(\d+)$/)[1]))
      .map(el=>el.getAttribute('d'));
  }).catch(()=>null);
  strokeCache.set(ch, p);
  return p;
}

/* ============================================================
   おと: Web Speech API (ja-JP)
   ============================================================ */
const speech = {
  ready: 'speechSynthesis' in window,
  voice: null,
  pick(){
    if(!this.ready) return;
    const vs = speechSynthesis.getVoices();
    this.voice = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang && v.lang.startsWith('ja')) || null;
  },
  say(text, rate=0.85){
    if(!this.ready) return null;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; u.rate=rate; u.pitch=1.15;
    if(this.voice) u.voice=this.voice;
    speechSynthesis.speak(u);
    return u;
  },
  stop(){ if(this.ready) speechSynthesis.cancel(); },
};
if(speech.ready){ speech.pick(); speechSynthesis.onvoiceschanged=()=>speech.pick(); }

/* よこ スワイプ を うけとる（よみ・クイズ の ページおくり）*/
function swipe(el, onLeft, onRight){
  let x0=null,y0=null;
  el.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)>56 && Math.abs(dx)>Math.abs(dy)*1.6){ dx<0 ? onLeft() : onRight(); }
  }, {passive:true});
  let mx=null;
  el.addEventListener('mousedown', e=>{ mx=e.clientX; });
  el.addEventListener('mouseup', e=>{
    if(mx===null) return; const dx=e.clientX-mx; mx=null;
    if(Math.abs(dx)>80){ dx<0 ? onLeft() : onRight(); }
  });
}

VIEWS.yomi = () => {
  const m = state.mons[state.yomiIndex];

  const v = $(`<div class="view"><div class="pad" style="background:#EAF6FF">

      </div>
      <button class="iconbtn press" id="next">${ICON.next}</button>
    </div>
  </div></div>`);

  v.querySelector('.iconbtn').onclick = ()=>go('home',{back:true});

  /* もじ を ならべる（うえ カタカナ / した ひらがな）*/
  const row = v.querySelector('#row');
  const tip = v.querySelector('#tip');
  const cells = chars.map((c,i)=>{
    const warn = CONFUSE[c] ? ' warn' : '';
    const cell = $(`<button class="moji press${warn}">
      <span class="k">${esc(c)}</span><span class="h">${esc(hira[i])}</span>
    </button>`);
    cell.onclick = ()=>{
      highlight(i, 900);
      speech.say(c, 0.7);
      state.readChars.add(baseOf(c));
      if(CONFUSE[c]){
        tip.hidden = false;
        tip.innerHTML = `<span style="font-size:19px">👀</span><span>${esc(CONFUSE_TIP[c] || `${c} は ${CONFUSE[c]} と にて いるよ\nよく みてね`)}</span>`;
      }
    };
    row.appendChild(cell);
    return cell;
  });

  let hlTimer = null;
  function highlight(i, ms){
    cells.forEach(c=>c.classList.remove('on'));
    if(i>=0 && cells[i]) cells[i].classList.add('on');
    clearTimeout(hlTimer);
    if(ms) hlTimer = setTimeout(()=>cells.forEach(c=>c.classList.remove('on')), ms);
  }

  /* ぜんぶ よむ: 1 もじずつ ハイライト しながら じゅんばん に よむ */
  let playing = false;
  const playBtn = v.querySelector('#play');
  async function playAll(){
    if(playing){ playing=false; speech.stop(); highlight(-1); playBtn.querySelector('span:last-child').textContent='ぜんぶ よむ'; return; }
    playing = true;
    playBtn.querySelector('span:last-child').textContent='とめる';
    for(let i=0;i<chars.length && playing;i++){
      highlight(i, 0);
      state.readChars.add(baseOf(chars[i]));
      await speakChar(chars[i]);
      if(!playing) break;
      await sleep(90);
    }
    if(playing){
      highlight(-1);
      await sleep(160);
      cells.forEach(c=>c.classList.add('on'));
      speech.say(m.kata, 0.85);
      await sleep(1100);
      cells.forEach(c=>c.classList.remove('on'));
    }
    playing = false;
    playBtn.querySelector('span:last-child').textContent='ぜんぶ よむ';
  }
  playBtn.onclick = playAll;

  const prev = ()=>{ state.yomiIndex = (state.yomiIndex-1+state.mons.length)%state.mons.length; go('yomi',{back:true}); };
  const next = ()=>{ state.yomiIndex = (state.yomiIndex+1)%state.mons.length; go('yomi'); };
  v.querySelector('#prev').onclick = prev;
  v.querySelector('#next').onclick = next;
  swipe(v, next, prev);

  currentCleanup = ()=>{ playing=false; clearTimeout(hlTimer); };
  return v;
};

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* 1 もじ を よんで、おわる まで まつ（よみあげ と ハイライト を そろえる）*/
function speakChar(ch){
  return new Promise(resolve=>{
    if(!speech.ready){ setTimeout(resolve, 420); return; }
    const u = speech.say(ch, 0.7);
    if(!u){ setTimeout(resolve, 420); return; }
    let done=false;
    const fin = ()=>{ if(done) return; done=true; resolve(); };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1400);   // こえ が でない かんきょう でも すすむ
  });
}

  const gGhost = v.querySelector('#ghost'), gDone = v.querySelector('#done');
  const gDemo = v.querySelector('#demo'), gLive = v.querySelector('#live'), gHint = v.querySelector('#hint');
  const gNum = v.querySelector('#num');
  const msgt = v.querySelector('#msgt');
  const row = v.querySelector('#row');

  /* うえ の もじ ならび（いま なぞって いる もじ が ひかる）*/
  const cells = chars.map((c,i)=>{
    const cell = $(`<button class="moji press"><span class="k">${esc(c)}</span></button>`);
    cell.onclick = ()=>{ ci=i; loadChar(); };
    row.appendChild(cell);
    return cell;
  });
  function paintRow(){
    cells.forEach((c,i)=>{
      c.classList.toggle('on', i===ci);
      c.classList.toggle('done', state.wroteChars.has(baseOf(chars[i])) && i!==ci);
    });
    v.querySelector('#pos').textContent = `${ci+1} / ${chars.length}`;
  }

  const svgns = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs)=>{ const e=document.createElementNS(svgns,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; };

  async function loadChar(){
    si=0; pts=[]; stopGuide(); gDone.innerHTML=''; gDemo.innerHTML=''; gLive.innerHTML=''; gGhost.innerHTML=''; gHint.innerHTML=''; gNum.innerHTML='';
    paintRow();
    msgt.textContent = 'よみこみ ちゅう…';
    strokes = await fetchStrokes(chars[ci]);
    if(!strokes || !strokes.length){
      msgt.textContent = 'この もじ の かきじゅん は よういして いません  つぎ の もじ へ';
      return;
    }
    strokes.forEach(d=> gGhost.appendChild(mk('path',{d, class:'stroke-ghost'})));
    msgt.textContent = 'きいろい ① から やじるし の むき に なぞろう';
    showStart();
  }

  /* ストローク の かきはじめ の てん を だす */
  function startPointOf(i){
    const p = mk('path',{d:strokes[i]});
    svg.appendChild(p);
    const pt = p.getPointAtLength(0);
    p.remove();
    return pt;
  }
  function pathPoints(i, n=26){
    const p = mk('path',{d:strokes[i]});
    svg.appendChild(p);
    const L = p.getTotalLength();
    const out=[]; for(let k=0;k<=n;k++) out.push(p.getPointAtLength(L*k/n));
    p.remove();
    return out;
  }
  /* かくすう の ばんごう を すべて の かく に だす（さいしょ から みえる）*/
  function drawNumbers(){
    gNum.innerHTML='';
    if(!strokes) return;
    strokes.forEach((d,i)=>{
      const tmp = mk('path',{d, style:'display:none'});
      gNum.appendChild(tmp);
      const a = tmp.getPointAtLength(0);
      const b = tmp.getPointAtLength(Math.min(tmp.getTotalLength(), 9));
      tmp.remove();
      /* かきだし の むき と ぎゃく に 10 ずらす（あかい ● と かさねない）*/
      let dx = a.x-b.x, dy = a.y-b.y;
      const len = Math.hypot(dx,dy) || 1;
      const pt = { x: Math.max(8, Math.min(101, a.x + dx/len*10)),
                   y: Math.max(8, Math.min(101, a.y + dy/len*10)) };
      const g = mk('g',{class:'snum'+(i<si?' past':(i===si?' now':''))});
      g.appendChild(mk('circle',{cx:pt.x, cy:pt.y, r:7}));
      const t = mk('text',{x:pt.x, y:pt.y});
      t.textContent = String(i+1);
      g.appendChild(t);
      gNum.appendChild(g);
    });
  }

  /* いま なぞる かく の うえ を、やじるし が かきじゅん の むき に すすむ */
  let guideRAF = null;
  function stopGuide(){ if(guideRAF){ cancelAnimationFrame(guideRAF); guideRAF=null; } gHint.innerHTML=''; }
  function showStart(){
    stopGuide();
    drawNumbers();
    if(si>=strokes.length) return;

    /* けいそく よう の パス は ひょうじ せず svg に おいて おく */
    const meas = mk('path',{d:strokes[si], style:'display:none'});
    gHint.appendChild(meas);
    const L = meas.getTotalLength();

    const head = mk('path',{d:'M0,-5.6 L9.4,0 L0,5.6 Z', class:'arrowhead'});
    gHint.appendChild(head);

    const DUR = Math.max(900, L*22);
    const REST = 420;
    let t0 = null;
    const step = (ts)=>{
      if(t0===null) t0 = ts;
      const cycle = (ts - t0) % (DUR + REST);
      const moving = cycle < DUR;
      const at = moving ? cycle / DUR : 0;
      const q  = meas.getPointAtLength(L*at);
      const q2 = meas.getPointAtLength(Math.min(L, L*at + 1.2));
      const ang = Math.atan2(q2.y-q.y, q2.x-q.x) * 180 / Math.PI;
      head.setAttribute('transform', `translate(${q.x},${q.y}) rotate(${ang})`);
      head.style.opacity = moving ? '1' : '0';
      guideRAF = requestAnimationFrame(step);
    };
    guideRAF = requestAnimationFrame(step);
  }

  /* かきじゅん の アニメーション（ストローク が じゅんばん に かかれて いく）*/
  let demoRunning = false;
  async function playDemo(){
    if(!strokes || demoRunning) return;
    demoRunning = true;
    gDemo.innerHTML=''; stopGuide();
    for(let i=0;i<strokes.length;i++){
      const p = mk('path',{d:strokes[i], class:'stroke-demo'});
      gDemo.appendChild(p);
      const L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      p.style.transition = `stroke-dashoffset ${Math.max(360, L*13)}ms ease-in-out`;
      await sleep(30);
      p.style.strokeDashoffset = 0;
      await sleep(Math.max(360, L*13) + 190);
    }
    await sleep(420);
    gDemo.innerHTML='';
    demoRunning = false;
    showStart();
  }
  v.querySelector('#demoBtn').onclick = playDemo;
  v.querySelector('#speak').onclick = ()=>speech.say(chars[ci], 0.7);

  /* ---- なぞり の はんてい（ゆるめ）----
     1. かきはじめ の ちかく から はじまって いるか
     2. きせき が ストローク の みちすじ を だいたい なぞって いるか
     3. おわり の てん の ちかく で おわって いるか                     */
  function judge(){
    if(pts.length < 4) return false;
    const target = pathPoints(si);
    const near = (a,b,r)=> Math.hypot(a.x-b.x, a.y-b.y) <= r;
    if(!near(pts[0], target[0], 30)) return false;
    if(!near(pts[pts.length-1], target[target.length-1], 32)) return false;
    let hit=0;
    for(const t of target){
      if(pts.some(p=>near(p,t,26))) hit++;
    }
    return hit / target.length >= 0.72;
  }

  function svgPoint(ev){
    const r = svg.getBoundingClientRect();
    const src = ev.touches ? ev.touches[0] : ev;
    return { x:(src.clientX-r.left)/r.width*109, y:(src.clientY-r.top)/r.height*109 };
  }
  function liveDraw(){
    gLive.innerHTML='';
    if(pts.length<2) return;
    const d = pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    gLive.appendChild(mk('path',{d, class:'stroke-live'}));
  }
  function onDown(e){
    if(!strokes || si>=strokes.length || demoRunning) return;
    e.preventDefault(); drawing=true; pts=[svgPoint(e)]; liveDraw();
  }
  function onMove(e){
    if(!drawing) return;
    e.preventDefault(); pts.push(svgPoint(e)); liveDraw();
  }
  function onUp(){
    if(!drawing) return;
    drawing=false;
    const ok = judge();
    gLive.innerHTML='';
    if(ok){
      gDone.appendChild(mk('path',{d:strokes[si], class:'stroke-done'}));
      si++;
      if(si>=strokes.length){
        state.wroteChars.add(baseOf(chars[ci]));
        state.readChars.add(baseOf(chars[ci]));
        msgt.textContent = 'かけたね！';
        speech.say(chars[ci], 0.7);
        setTimeout(()=>{
          if(ci < chars.length-1){ ci++; loadChar(); }
          else finish();
        }, 800);
      }else{
        msgt.textContent = `${si+1} かくめ  やじるし の むき に なぞろう`;
        showStart();
      }
    }else{
      msgt.textContent = 'もう いちど  やじるし に そって ゆっくり なぞろう';
      const w = v.querySelector('#wrap');
      w.style.animation='shake .34s ease'; setTimeout(()=>w.style.animation='', 360);
    }
  }
  const wrap = v.querySelector('#wrap');
  wrap.addEventListener('touchstart', onDown, {passive:false});
  wrap.addEventListener('touchmove', onMove, {passive:false});
  wrap.addEventListener('touchend', onUp);
  wrap.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cleanupFns.push(()=>{ window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); });

  function finish(){
    const already = state.caught.has(m.id);
    state.caught.add(m.id);
    showGet(m, already ? 'かけた！' : 'ゲット！', already ? 'ぜんぶ かけたね' : 'ずかん に とうろく したよ', ()=>go('kaki'));
  }

  const prev = ()=>{ state.kakiIndex=(state.kakiIndex-1+state.mons.length)%state.mons.length; go('kaki',{back:true}); };
  const next = ()=>{ state.kakiIndex=(state.kakiIndex+1)%state.mons.length; go('kaki'); };
  v.querySelector('#prev').onclick = prev;
  v.querySelector('#next').onclick = next;

  currentCleanup = ()=>{ demoRunning=false; drawing=false; stopGuide(); cleanupFns.forEach(f=>f()); };
  loadChar();
  return v;
};

/* ============================================================
   クイズ（3 しゅるい を じゅんばん に だす）
   0: え → なまえ の 4たく
   1: あなぬけ（なまえ の 1 もじ が ぬけて いる）
   2: なまえ → え（ぎゃくむき）
   ============================================================ */
function pickOthers(id, n){
  const rest = state.mons.filter(x=>x.id!==id);
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  return rest.slice(0,n);
}
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

VIEWS.quiz = () => {
  const m = state.mons[state.quizIndex];
  const mode = state.quizMode;
  const v = $(`<div class="view"><div class="pad" style="background:#FFEDE8">
    <div class="hd">
      <button class="iconbtn press" aria-label="もどる">${ICON.back}</button>
      <h1>クイズ</h1>
      <div class="pill">${['4たく','あなぬけ','なまえ から え'][mode]}</div>
    </div>
    <div id="stage" style="flex:none;"></div>
    <div style="font-size:22px; font-weight:900; text-align:center; flex:none;" id="q"></div>
    <div class="choices" id="ch"></div>
    <div style="flex:1"></div>
  </div></div>`);
  v.querySelector('.iconbtn').onclick = ()=>go('home',{back:true});

  const stage = v.querySelector('#stage'), ch = v.querySelector('#ch'), q = v.querySelector('#q');
  let answered = false;

  function correct(){
    if(answered) return; answered = true;
    const already = state.caught.has(m.id);
    splitChars(m.kata).forEach(c=>state.readChars.add(baseOf(c)));
    state.caught.add(m.id);
    setTimeout(()=>{
      showGet(m, already?'せいかい！':'ゲット！', already?'もう ずかん に いるよ':'ずかん に とうろく したよ', ()=>{
        state.quizIndex = (state.quizIndex+1)%state.mons.length;
        state.quizMode = (state.quizMode+1)%3;
        go('quiz');
      });
    }, 620);
  }
  function wrong(btn){
    if(answered) return;
    btn.classList.add('ng');
    speech.say('もう いちど', 0.85);
    setTimeout(()=>btn.classList.remove('ng'), 460);
  }

  if(mode === 0 || mode === 1){
    stage.innerHTML = `<div class="card" style="height:236px; display:flex; align-items:center; justify-content:center;">
      <img src="${esc(m.img)}" alt="" style="width:212px; height:212px; object-fit:contain;"></div>`;
  }

  if(mode === 0){
    q.textContent = 'なまえ は どれ かな?';
    const opts = shuffle([m, ...pickOthers(m.id,3)]);
    opts.forEach(o=>{
      const b = $(`<button class="choice press">${esc(o.kata)}</button>`);
      b.onclick = ()=>{
        speech.say(o.kata, 0.8);
        if(o.id===m.id){ b.classList.add('ok'); correct(); } else wrong(b);
      };
      ch.appendChild(b);
    });
  }

  if(mode === 1){
    const chars = splitChars(m.kata);
    const hole = Math.floor(Math.random()*chars.length);
    const ans = chars[hole];
    q.textContent = 'どの もじ が はいる かな?';
    const disp = $(`<div class="card" style="margin-top:10px; padding:12px 8px 14px;"><div class="moji-row" id="w"></div></div>`);
    stage.appendChild(disp);
    const w = disp.querySelector('#w');
    chars.forEach((c,i)=>{
      const blank = i===hole;
      w.appendChild($(`<div class="moji" style="${blank?'background:#FFF1CF; border-style:dashed;':''}">
        <span class="k">${blank?'？':esc(c)}</span>
        <span class="h">${blank?'':esc(toHira(c))}</span></div>`));
    });
    const pool = shuffle([ans, ...shuffle(GOJUON.flat().filter(x=>x && x!==ans)).slice(0,3)]);
    pool.forEach(c=>{
      const b = $(`<button class="choice press" style="font-size:38px;">${esc(c)}</button>`);
      b.onclick = ()=>{
        speech.say(c, 0.7);
        if(c===ans){
          b.classList.add('ok');
          w.children[hole].outerHTML = `<div class="moji on"><span class="k">${esc(ans)}</span><span class="h">${esc(toHira(ans))}</span></div>`;
          state.readChars.add(baseOf(ans));
          correct();
        } else wrong(b);
      };
      ch.appendChild(b);
    });
  }

  if(mode === 2){
    q.textContent = 'この なまえ の モンスター は どれ?';
    stage.innerHTML = `<div class="card" style="height:104px; display:flex; align-items:center; justify-content:center;">
      <div style="font-size:46px; font-weight:900; letter-spacing:.05em;">${esc(m.kata)}</div></div>`;
    const spk = $(`<button class="big press" style="margin-top:10px; background:var(--blue); font-size:24px;">${ICON.speakW}<span>よんで もらう</span></button>`);
    spk.onclick = ()=>speech.say(m.kata, 0.8);
    stage.appendChild(spk);
    const opts = shuffle([m, ...pickOthers(m.id,3)]);
    opts.forEach(o=>{
      const b = $(`<button class="choice press" style="min-height:110px;"><img src="${esc(o.img)}" alt="" style="width:94px; height:94px; object-fit:contain;"></button>`);
      b.onclick = ()=>{ if(o.id===m.id){ b.classList.add('ok'); correct(); } else wrong(b); };
      ch.appendChild(b);
    });
  }

  const next = ()=>{ state.quizIndex=(state.quizIndex+1)%state.mons.length; state.quizMode=(state.quizMode+1)%3; go('quiz'); };
  swipe(v, next, next);
  return v;
};

/* ============================================================
   なまえ づくり
   ・え を みて、もじ を 1 つずつ えらんで なまえ を くみたてる
   ・ならべた もじ は タップ で とりけせる
   ・ぜんぶ そろったら ゲット
   ============================================================ */
VIEWS.tsukuru = () => {
  const m = state.mons[state.tsukuruIndex];
  const answer = splitChars(m.kata);
  let put = [];                       // いま ならべた もじ

  /* えらぶ もじ: せいかい の もじ + じゃま の もじ を まぜる */
  const decoys = shuffle(GOJUON.flat().filter(x=>x && !answer.includes(x)))
    .slice(0, Math.max(3, Math.min(6, 10-answer.length)));
  const pool = shuffle([...answer, ...decoys]);

  const v = $(`<div class="view"><div class="pad" style="background:#F3EEFF; gap:12px;">
    <div class="hd">
      <button class="iconbtn press" aria-label="もどる">${ICON.back}</button>
      <h1 style="font-size:24px">なまえ づくり</h1>
      <div class="pill">No.${m.no}</div>
    </div>

    <div class="card" style="flex:none; height:196px; display:flex; align-items:center; justify-content:center;">
      <img src="${esc(m.img)}" alt="" style="width:178px; height:178px; object-fit:contain;">
    </div>

    <div style="font-size:19px; font-weight:900; text-align:center; flex:none;">もじ を えらんで なまえ に しよう</div>

    <div class="card" style="flex:none; padding:12px 10px;">
      <div class="slots" id="slots"></div>
    </div>

    <div class="card" style="flex:1; min-height:0; padding:12px 10px; overflow-y:auto;">
      <div class="pool" id="pool"></div>
    </div>

    <div style="display:flex; gap:10px; flex:none;">
      <button class="iconbtn press" id="undo" style="width:84px; height:84px; border-radius:var(--r-l); background:var(--yellow);">
        <svg viewBox="0 0 100 100" width="36" height="36"><path d="M30 34 h34 a20 20 0 1 1 0 40 h-26" fill="none" stroke="#33241A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 20 L26 34 L42 48" fill="none" stroke="#33241A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="big press" id="hint" style="flex:1; height:84px; background:var(--blue); font-size:23px;">${ICON.speakW}<span>よんで もらう</span></button>
    </div>
  </div></div>`);

  v.querySelector('.iconbtn').onclick = ()=>go('home',{back:true});
  const slotsEl = v.querySelector('#slots'), poolEl = v.querySelector('#pool');

  function paintSlots(){
    slotsEl.innerHTML='';
    answer.forEach((c,i)=>{
      const filled = i < put.length;
      const el = $(`<button class="slot ${filled?'filled':''}">
        <span class="k">${filled?esc(put[i]):''}</span>
        <span class="h">${filled?esc(toHira(put[i])):''}</span>
      </button>`);
      if(filled) el.onclick = ()=>{ put = put.slice(0,i); speech.say(put.length?put[put.length-1]:'', 0.7); paintAll(); };
      slotsEl.appendChild(el);
    });
  }

  function paintPool(){
    poolEl.innerHTML='';
    /* おなじ もじ が なまえ に 2 かい でる ばあい に そなえ、つかった かず で かんりする */
    const used = {};
    put.forEach(c=>{ used[c] = (used[c]||0)+1; });
    const seen = {};
    pool.forEach(c=>{
      seen[c] = (seen[c]||0)+1;
      const spent = (used[c]||0) >= seen[c];
      const b = $(`<button class="ptile press ${spent?'spent':''}">
        <span class="k">${esc(c)}</span><span class="h">${esc(toHira(c))}</span></button>`);
      if(!spent) b.onclick = ()=>{
        if(put.length >= answer.length) return;
        speech.say(c, 0.7);
        put.push(c);
        paintAll();
        check();
      };
      poolEl.appendChild(b);
    });
  }

  function paintAll(){ paintSlots(); paintPool(); }

  function check(){
    if(put.length < answer.length) return;
    const ok = put.every((c,i)=>c===answer[i]);
    if(ok){
      [...slotsEl.children].forEach((el,i)=>{
        setTimeout(()=>el.classList.add('ok'), i*90);
      });
      splitChars(m.kata).forEach(c=>state.readChars.add(baseOf(c)));
      const already = state.caught.has(m.id);
      state.caught.add(m.id);
      setTimeout(()=>{
        showGet(m, already?'できた！':'ゲット！', already?'なまえ を つくれたね':'ずかん に とうろく したよ', ()=>{
          state.tsukuruIndex = (state.tsukuruIndex+1)%state.mons.length;
          go('tsukuru');
        });
      }, answer.length*90 + 480);
    }else{
      slotsEl.style.animation='shake .38s ease';
      setTimeout(()=>slotsEl.style.animation='', 400);
      speech.say('もう いちど', 0.85);
      /* まちがえた ばあい は、あって いる ところ まで もどす */
      let keep = 0;
      while(keep < put.length && put[keep] === answer[keep]) keep++;
      setTimeout(()=>{ put = put.slice(0, keep); paintAll(); }, 420);
    }
  }

  v.querySelector('#undo').onclick = ()=>{ if(put.length){ put.pop(); paintAll(); } };
  v.querySelector('#hint').onclick = ()=>speech.say(m.kata, 0.75);

  paintAll();
  return v;
};

/* その もじ が なまえ に はいって いる モンスター の いちらん を だす */
function monsWithChar(c){
  return state.mons.filter(m => splitChars(m.kata).some(x => baseOf(x) === c));
}

function showCharMons(c){
  const hit = monsWithChar(c);
  const sheet = $(`<div class="sheet">
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <div class="sheet-hd">
        <div class="sheet-moji"><span class="k">${esc(c)}</span><span class="h">${esc(toHira(c))}</span></div>
        <div style="flex:1">
          <div style="font-size:20px; font-weight:900; line-height:1.2;">${esc(c)} が つく モンスター</div>
          <div style="font-size:15px; font-weight:800; opacity:.65; margin-top:4px;">${hit.length} ひき</div>
        </div>
        <button class="iconbtn press" id="x" style="width:52px; height:52px;">
          <svg viewBox="0 0 100 100" width="26" height="26"><path d="M28 28 L72 72 M72 28 L28 72" stroke="#33241A" stroke-width="12" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="list"></div>
    </div>
  </div>`);

  const list = sheet.querySelector('#list');
  if(!hit.length){
    list.appendChild($(`<div class="note" style="margin:4px 0;">
      <span style="font-size:19px">🔎</span><span>この もじ が つく モンスター は まだ いないよ</span></div>`));
  }
  hit.forEach(m=>{
    const got = state.caught.has(m.id);
    const chars = splitChars(m.kata).map(x =>
      `<span class="mini ${baseOf(x)===c?'hit':''}">${esc(x)}</span>`).join('');
    const row = $(`<button class="hitrow press">
      <img src="${esc(m.img)}" alt="" style="${got?'':'filter:brightness(0) opacity(.34);'}">
      <span style="flex:1; text-align:left;">
        <span class="hitno">No.${m.no}</span>
        <span class="hitname">${got?chars:'？？？'}</span>
      </span>
    </button>`);
    row.onclick = ()=>{
      if(!got){ toast('クイズ で あてると なまえ が わかるよ'); return; }
      speech.say(m.kata, 0.8);
      state.yomiIndex = state.mons.findIndex(x=>x.id===m.id);
      sheet.remove();
      go('yomi');
    };
    list.appendChild(row);
  });

  const close = ()=>sheet.remove();
  sheet.querySelector('#x').onclick = close;
  sheet.querySelector('.sheet-bg').onclick = close;
  screenEl.appendChild(sheet);
}

/* ============================================================
   きどう: PokeAPI から とりよせて から ホーム を だす
   ============================================================ */
VIEWS.loading = (o) => $(`<div class="view"><div class="center">
  <div class="spinner"></div>
  <div>${esc(o.msg||'ポケモン の データ を とりよせて います…')}</div>
</div></div>`);

VIEWS.error = (o) => {
  const v = $(`<div class="view"><div class="center">
    <div style="font-size:44px">📡</div>
    <div>データ を とりよせられません でした<br><span style="font-size:14px; opacity:.7">${esc(o.msg||'')}</span></div>
    <button class="big press" style="width:100%;"><span>もう いちど</span></button>
  </div></div>`);
  v.querySelector('button').onclick = boot;
  return v;
};

async function boot(){
  go('loading', {});
  try{
    const mons = await Promise.all(DEX.map(fetchMon));
    state.mons = mons;
    /* さいしょ の 3 ひき は ゲットずみ に して、ずかん の みため を わかりやすく する */
    mons.slice(0,3).forEach(m=>{
      state.caught.add(m.id);
      splitChars(m.kata).forEach(c=>state.readChars.add(baseOf(c)));
    });
    go('home');
  }catch(err){
    go('error', {msg:String(err && err.message || err)});
  }
}
boot();
</script>
