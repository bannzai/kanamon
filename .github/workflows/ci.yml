name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  # public repo のため macOS runner は無料 (private では使わない方針の例外)
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make build-ios
      - name: Simulator を解決する
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          [ -n "$udid" ] || { echo "::error::利用可能な iOS Simulator が見つかりません" >&2; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: make test SIMULATOR_UDID=${{ steps.simulator.outputs.udid }}
